name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write
# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,test]"

      - name: Install mypy explicitly
        run: uv pip install --system mypy

      - name: Run format check (Black)
        run: black --check .

      - name: Run lint (Ruff)
        run: ruff check .

      - name: Run type check (mypy)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true  # Make non-blocking initially

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term

      #- name: Upload coverage to Codecov
      #  uses: codecov/codecov-action@v4
      #  with:
      #    file: ./coverage.xml
      #    fail_ci_if_error: false
      #  env:
      #    CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    needs: quality  # Only run if quality checks pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ github.repository }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: 'trivy-results.sarif'
